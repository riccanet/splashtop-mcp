[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splashtop-mcp"
version = "1.0.0"
description = "Model Context Protocol server for the Splashtop Open API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
splashtop-mcp = "splashtop_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/splashtop_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
